[package]
name = "lineup-gateway"
description = "A gateway for lineup: turns references (Acestream ids, video pages) into playable URLs"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "lineup-gateway"
path = "src/main.rs"

[dependencies]
gateway-contract.workspace = true
anyhow.workspace = true
chrono.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["process", "net", "io-util"] }
tracing.workspace = true
tracing-subscriber.workspace = true
url.workspace = true
axum = "0.8"
reqwest = { version = "0.13", features = ["json", "query", "stream"] }
futures-util = "0.3"
bytes = "1"
toml = "0.9"

[dev-dependencies]
tempfile = "3"
