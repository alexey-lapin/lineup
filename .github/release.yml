# Categories for GitHub's generated release notes, by pull request label. .github/labeler.yml sets
# the label from the branch prefix (CONTRIBUTING.md); Renovate labels its own pull requests.
changelog:
  exclude:
    labels: [skip-changelog]
  categories:
    - title: Features
      labels: [enhancement]
    - title: Fixes
      labels: [bug]
    - title: Documentation
      labels: [documentation]
    - title: Dependencies
      labels: [dependencies]
    - title: Other changes
      labels: ["*"]
