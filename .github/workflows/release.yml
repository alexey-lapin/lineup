name: release

on:
  push:
    tags: ["v*"]
  # Rebuild an existing tag (e.g. after a failed image build) without moving it.
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build, e.g. v0.1.0
        required: true
      cli:
        description: Also build the CLI archives and create or update the GitHub release
        type: boolean
        default: false

env:
  TAG: ${{ inputs.tag || github.ref_name }}
  IMAGE: ghcr.io/${{ github.repository_owner }}/lineup

permissions:
  contents: write
  packages: write

jobs:
  # Same checks as CI; nothing is published unless they pass for the tagged commit.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.TAG }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
      - run: |
          cargo run -q --locked -p lineup-server --bin openapi > /tmp/openapi.json
          diff -u web/src/api/openapi.json /tmp/openapi.json
      - working-directory: web
        run: |
          pnpm install --frozen-lockfile
          pnpm gen:api && git diff --exit-code src/api/schema.d.ts
          pnpm build
          pnpm test

  # Each architecture builds on its own native runner; emulating arm64 under
  # QEMU makes the Rust build take well over an hour. Two images: lineup and lineup-gateway.
  image:
    needs: verify
    strategy:
      matrix:
        component:
          - { name: lineup, file: Dockerfile }
          - { name: lineup-gateway, file: Dockerfile.gateway }
        arch:
          - { platform: linux/amd64, runner: ubuntu-24.04 }
          - { platform: linux/arm64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.arch.runner }}
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/${{ matrix.component.name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.TAG }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.component.file }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: ${{ matrix.arch.platform }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.component.name }}-${{ matrix.arch.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component.name }}-${{ matrix.arch.platform }}
      - run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"
      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.component.name }}-${{ matrix.arch.runner }}
          path: /tmp/digests/*
          retention-days: 1

  manifest:
    needs: image
    strategy:
      matrix:
        name: [lineup, lineup-gateway]
    runs-on: ubuntu-latest
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: digest-${{ matrix.name }}-ubuntu-*
          path: /tmp/digests
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          # A manual rebuild of an older tag must not move latest.
          flavor: latest=${{ github.event_name == 'push' && 'auto' || 'false' }}
          tags: |
            type=semver,pattern={{version}},value=${{ env.TAG }}
            type=semver,pattern={{major}}.{{minor}},value=${{ env.TAG }}
      - working-directory: /tmp/digests
        run: |
          mapfile -t tags < <(jq -r '.tags[] | "-t", .' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          refs=()
          for d in *; do refs+=("$IMAGE@sha256:$d"); done
          docker buildx imagetools create "${tags[@]}" "${refs[@]}"
      - run: docker buildx imagetools inspect ${{ env.IMAGE }}:${{ steps.meta.outputs.version }}

  # The web UI is embedded in every binary; build it once.
  web:
    needs: verify
    if: github.event_name == 'push' || inputs.cli
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.TAG }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist
          retention-days: 1

  cli:
    needs: web
    strategy:
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.TAG }}
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/dist
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - run: cargo build --release --locked -p lineup --target ${{ matrix.target }}
      - run: tar -C target/${{ matrix.target }}/release -czf lineup-${{ env.TAG }}-${{ matrix.target }}.tar.gz lineup
      - uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.target }}
          path: lineup-${{ env.TAG }}-${{ matrix.target }}.tar.gz
          retention-days: 1

  # Published only once the image and every archive exist, so a release is never partial.
  release:
    needs: [manifest, cli]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      # The workflow's own commit (it carries the notes script), with all history and tags so the
      # notes can be computed for TAG even when rebuilding an older release.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: cli-*
          path: dist
          merge-multiple: true
      - working-directory: dist
        run: sha256sum lineup-*.tar.gz > SHA256SUMS && cat SHA256SUMS
      - run: .github/scripts/release-notes.sh "$TAG" "$IMAGE" > notes.md && cat notes.md
      - name: Create or update the release
        run: |
          flags=()
          [[ $TAG == *-* ]] && flags+=(--prerelease)
          if gh release view "$TAG" >/dev/null 2>&1; then
            # A rebuild of an existing release: replace the files; fill in notes only if it has none.
            gh release upload "$TAG" dist/* --clobber
            if [[ -z $(gh release view "$TAG" --json body --jq .body) ]]; then
              gh release edit "$TAG" --notes-file notes.md
            fi
          else
            # Draft first, so the release appears complete or not at all.
            gh release create "$TAG" --verify-tag --draft --title "lineup $TAG" --notes-file notes.md "${flags[@]}" dist/*
            gh release edit "$TAG" --draft=false
          fi
