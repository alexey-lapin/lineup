# lineup-gateway configuration. Mount your own at /etc/lineup-gateway.toml.
# Check a config without starting the gateway: lineup-gateway --check-config --config <file>

listen = "0.0.0.0:8099"

# ---------------------------------------------------------------------------------------------
# Extractors: commands that look a page up. `{url}` is the page, `{proxy}` the gateway's egress
# proxy (required: every tool's traffic goes through it).

[extractors.yt-dlp]
command = "/opt/tools/bin/yt-dlp"
args = ["--ignore-config", "--no-playlist", "--no-warnings", "--dump-single-json",
        "--socket-timeout", "15", "--proxy", "{proxy}", "--", "{url}"]
output = "yt-dlp-json"

[extractors.streamlink]
command = "/opt/tools/bin/streamlink"
args = ["--no-config", "--json", "--http-proxy", "{proxy}", "--", "{url}", "best"]
output = "streamlink-json"

# ---------------------------------------------------------------------------------------------
# Rules: each [rules.<name>] block is a rule lineup routes can use, by that name. Patterns are
# tried in order; the first that matches gives the variables for the templates. Examples are
# checked every time the config is loaded.

# VK video pages, live or recorded, looked up by the extractors and relayed as HLS. The `list`
# access token is kept in the ref: some videos need it.
[rules.vk]
kind = "relay"
title = "VK video"
input_hint = "vk.com, vkvideo.ru or vksport link to a video or broadcast"
group = "VK"
extractors = ["yt-dlp", "streamlink"]
vars = { owner = "int", video = "pos" }
identity = "vk:{owner}_{video}"
ref = "https://vk.com/video{owner}_{video}{?list}"

[[rules.vk.match]]   # ?z=video<owner>_<video> (a video opened over another page)
hosts = ["vk.com", "vk.ru", "vkvideo.ru"]
query = [
  { param = "z", re = 'video(?P<owner>-?[0-9]+)_(?P<video>[0-9]+)(?:[^0-9].*)?' },
  { param = "list", re = '(?P<list>[A-Za-z0-9_-]{1,64})', optional = true },
]

[[rules.vk.match]]   # the embed player; its `hash` is the access token when there is no `list`
hosts = ["vk.com", "vk.ru", "vkvideo.ru"]
path = '^/video_ext\.php'
query = [
  { param = "oid", re = '(?P<owner>-?[0-9]+)' },
  { param = "id", re = '(?P<video>[0-9]+)' },
  { param = "list", re = '(?P<list>[A-Za-z0-9_-]{1,64})', optional = true },
  { param = "hash", re = '(?P<list>[A-Za-z0-9_-]{1,64})', optional = true },
]

[[rules.vk.match]]   # /video-1_2, /video/-1_2, /@group/video-1_2, …
hosts = ["vk.com", "vk.ru", "vkvideo.ru"]
path = 'video/?(?P<owner>-?[0-9]+)_(?P<video>[0-9]+)'
query = [{ param = "list", re = '(?P<list>[A-Za-z0-9_-]{1,64})', optional = true }]

[[rules.vk.match]]   # /live-1_2: the dash is the owner's sign
hosts = ["vk.com", "vk.ru", "vkvideo.ru"]
path = 'live(?P<owner>-[0-9]+)_(?P<video>[0-9]+)'
query = [{ param = "list", re = '(?P<list>[A-Za-z0-9_-]{1,64})', optional = true }]

[[rules.vk.match]]   # legacy vkserve proxy URLs, on any host
path = '/vk/(?P<owner>-?[0-9]+)_(?P<video>[0-9]+)'
query = [{ param = "list", re = '(?P<list>[A-Za-z0-9_-]{1,64})', optional = true }]

[[rules.vk.examples]]
input = "https://sport.vkvideo.ru/live-100001_200002?list=0a1b2c3d4e5f6a7b8c"
identity = "vk:-100001_200002"
ref = "https://vk.com/video-100001_200002?list=0a1b2c3d4e5f6a7b8c"
play = "play/vk.m3u8?ref=https%3A%2F%2Fvk.com%2Fvideo-100001_200002%3Flist%3D0a1b2c3d4e5f6a7b8c"
